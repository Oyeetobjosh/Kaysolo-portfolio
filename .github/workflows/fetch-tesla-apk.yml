name: Fetch Tesla APK for authorized analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest package from APKCombo
        run: |
          git clone --depth 1 https://github.com/MarkSunDev/skill-android-app-analyzer /tmp/analyzer
          python -m pip install requests beautifulsoup4
          python /tmp/analyzer/apkcombo_download.py com.teslamotors.tesla --output "$RUNNER_TEMP/tesla" --type xapk
          find "$RUNNER_TEMP/tesla" -type f \( -name '*.apk' -o -name '*.xapk' \) -exec cp {} "$RUNNER_TEMP/" \;
          sha256sum "$RUNNER_TEMP"/*.xapk "$RUNNER_TEMP"/*.apk 2>/dev/null | tee "$RUNNER_TEMP/SHA256SUMS" || true
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-android-latest
          path: |
            ${{ runner.temp }}/*.apk
            ${{ runner.temp }}/*.xapk
            ${{ runner.temp }}/SHA256SUMS
          compression-level: 0
          retention-days: 1
